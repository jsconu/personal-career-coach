name: Publish downloadable coach
on:
  push:
    branches: [main]
    paths:
      - 'personal-career-coach/**'
      - 'LICENSE'
      - '.github/workflows/publish-skill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-coach
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the skill ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Build the upload ZIP here rather than committing it: the Claude directory
          # refuses binary files in a plugin from an unverified organization.
          work="$(mktemp -d)"
          mkdir "$work/personal-career-coach"
          cp personal-career-coach/SKILL.md LICENSE "$work/personal-career-coach/"
          (cd "$work" && zip -qX -r personal-career-coach.zip personal-career-coach)
          unzip -p "$work/personal-career-coach.zip" personal-career-coach/SKILL.md | cmp personal-career-coach/SKILL.md -
          tag="skill-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Personal Career Coach" --notes "Download the skill ZIP below." --draft
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$tag" "$work/personal-career-coach.zip" --clobber
            gh release edit "$tag" --draft=false --latest
          fi
